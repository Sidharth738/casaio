name: TypeScript CI diagnostic

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to diagnose
        required: true
        default: 606a8f3cdf183f2507048558377f8438c1677801
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Print checkout and toolchain
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git status --short
          node --version
          npm --version

      - name: Clean dependency install
        shell: bash
        run: npm ci

      - name: Print resolved dependencies and file hashes
        shell: bash
        run: |
          set -euxo pipefail
          npm exec -- tsc --version
          npm ls typescript firebase-admin firebase @types/node --depth=0
          sha256sum package.json package-lock.json tsconfig.json

      - name: Capture TypeScript configuration
        shell: bash
        run: |
          set -o pipefail
          npm exec -- tsc --showConfig | tee tsconfig.resolved.json

      - name: Run TypeScript check
        shell: bash
        run: |
          set -o pipefail
          npm exec -- tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: |
            tsconfig.resolved.json
            typecheck.log
