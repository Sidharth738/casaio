name: Security verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Application and security unit tests
        run: firebase emulators:exec --project demo-casaio-rules --only auth,firestore,storage "npm test"
        env:
          NODE_ENV: test
          NEXT_PUBLIC_CASAIO_FIREBASE_EMULATORS: 'true'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-casaio-rules
          FIREBASE_PROJECT_ID: demo-casaio-rules
          GCLOUD_PROJECT: demo-casaio-rules
          GOOGLE_CLOUD_PROJECT: demo-casaio-rules
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:18080

      - name: Telegram media, upload, and contact route tests
        run: npm run test:security-routes

      - name: Firebase Firestore rules tests
        run: npm run test:rules

      - name: Firebase Storage rules tests
        run: npm run test:storage-rules
